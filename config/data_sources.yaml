  # ── Intradía 5m: etiquetado y ejecución (plan.md §8.1) ────────────────────
  # El límite rodante del proveedor se declara (`history_window_limit_days`) y se
  # pide la ventana máxima disponible: la barra de 5m solo se sirve ~60 días.
  - series_id: "^GSPC"
    dataset: market_intraday
    asset_class: index
    granularity: intraday
    interval: "5m"
    primary: yfinance
    fallbacks: []
