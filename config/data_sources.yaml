# Fuentes de datos de mercado — tarea #3.
#
# Declaración **por serie** de: dataset destino en el almacén, clase de activo,
# granularidad, fuente primaria, respaldos y cobertura mínima exigida
# (`_docs/plan.md` §8.1, `_docs/tech_stack.md` §4.5 y §12.4).
#
# Reglas que este fichero hace cumplir:
#
# - El respaldo **no sustituye en silencio**: la fila guardada lleva el `source`
#   que entregó el dato de verdad y el informe de cobertura lo dice.
# - `SPX500:CFD` **no se sustituye** por `^GSPC`, `ES=F` ni `SPY`: no hay ninguna
#   entrada de `series:` que lo mapee. Su ausencia de fuente se documenta en
#   `_docs/data_sources.md` y en el bloque `unavailable:` de aquí abajo.
# - No se contrata ni se inventa ninguna fuente nueva en esta tarea.

version: 1

series:
  # ── Índice y su referencia real ───────────────────────────────────────────
  - series_id: "^GSPC"
    dataset: market_daily
    asset_class: index
    granularity: daily
    interval: "1d"
    primary: yfinance
    fallbacks: [stooq]
    min_start: 2005-01-01
    volume_expected: false
  - series_id: "ES=F"
