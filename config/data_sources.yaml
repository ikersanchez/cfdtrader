# ── Series sin fuente: se declaran, no se sustituyen ────────────────────────
# `SPX500:CFD` es el instrumento del proyecto y NO se puede mapear a `^GSPC`,
# `ES=F` ni `SPY`: son instrumentos distintos (plan.md §3.1). El bloqueo de la
# Fase 1 se declara con `phase1_ready: false` y `blockers[].code =
# "cfd_source_missing"`.
unavailable:
  - series_id: "SPX500:CFD"
    status: unavailable
    bid_ask: false
    reason: >-
      No hay fuente pública gratuita del intradía histórico del SPX500:CFD ni de
      su bid/ask. Comprobado el 2026-09-17: Yahoo sirve el índice (^GSPC) y el
      futuro (ES=F) con yfinance, pero ninguno es el CFD; Stooq responde con un
      challenge JavaScript, no CSV. Sustituirlo por ^GSPC o ES=F falsearía la
      medición de coste y de tracking difference.
    checked_on: 2026-09-17
    follow_up_issue: 50
    documentation: "_docs/data_sources.md"
