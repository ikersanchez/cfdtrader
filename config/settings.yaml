# Configuración del sistema — bróker, tier, umbrales, capital.
#
# El esquema de los valores ya cerrados lo define Pydantic en
# `src/cfdtrader/data/settings.py` (tech_stack.md §4.2: un error de configuración
# debe fallar al arrancar, no a mitad del pipeline).
#
# Solo está cerrado `data.root`: la raíz del almacén. El resto de bloques siguen
# sin esquema porque son decisiones abiertas (tech_stack.md §11 bis): no se
# inventan valores para el bróker, el tier, los umbrales ni el capital.

data:
  # Raíz del almacén (`<raíz>/raw/`, `<raíz>/derived/`, `<raíz>/cache/`).
  # Relativa al directorio de trabajo; ignorada por git vía `/data/` en .gitignore.
  root: data
