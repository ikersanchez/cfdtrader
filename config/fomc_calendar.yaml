# Calendario de reuniones del FOMC — parte (a) de #114.
#
# Esquema: `src/cfdtrader/data/calendar.py` (Pydantic, `extra="forbid"`).
#
# La fuente es el calendario público de la Reserva Federal. A diferencia de una noticia, este
# calendario se **publica con antelación**: usarlo para bloquear un día futuro **no es look-ahead**.
# Lo que hay que declarar es la procedencia y la fecha en que se consultó.
#
# La propia Fed advierte —y por eso está copiado aquí— que las fechas son **provisionales** hasta
# la reunión inmediatamente anterior.
#
# Cómo se recuperó la sección de 2026 (2026-10-04). Los **lectores** de página se cortan antes de
# 2026 —la página (167 KB) no cabe entera y 2026 cae en el hueco; probados dos lectores— y las rutas
# por año dan **404** (comprobado también en el índice de URLs de Wayback, que confirma que **no**
# existe una página por año). Lo que sí funciona es **pedir la página y parsearla en local**: 165.456
# bytes, con el bloque de 2026 entero. La conclusión es que el problema era el lector, no la fuente.
#
# Contraste independiente: las ocho reuniones de 2026 coinciden (a) con la lista que aportó el
# propietario el 2026-10-04 y (b) con el último dato publicado en FRED, que fecha la reunión de
# septiembre el **2026-09-16**, coherente con «September 15-16».
#
# Y la regla que sostiene todo esto: un año **ausente** produce un aviso visible, nunca un conjunto
# vacío silencioso: «hoy no hay FOMC» y «nadie ha declarado el calendario» son cosas distintas y el
# camino diario tiene que poder distinguirlas. Si un año no se puede recuperar, se declara en
# `pending` con su motivo —y el aviso lo **nombra**— en vez de inventarle una fecha.

version: 1
source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
verified_on: 2026-10-04
tentative_note: >-
  Each meeting date is tentative until confirmed at the meeting immediately preceding it.

# Días de reunión por año: cada año lleva **las ocho reuniones** con sus dos días, tal como la Fed
# las publica. Decidir si bloquea sólo el día del comunicado (el segundo, 14:00 ET) o también el
# primero es una decisión de estrategia (`plan.md` §19), no de este artefacto: aquí se declara lo
# que la fuente dice.
