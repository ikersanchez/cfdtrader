# Calendario de reuniones del FOMC — parte (a) de #114.
#
# Esquema: `src/cfdtrader/data/calendar.py` (Pydantic, `extra="forbid"`).
#
# La fuente es el calendario público de la Reserva Federal. A diferencia de una noticia, este
# calendario se **publica con antelación**: usarlo para bloquear un día futuro **no es look-ahead**.
# Lo que hay que declarar es la procedencia y la fecha en que se consultó.
#
# La propia Fed advierte —y por eso está copiado aquí— que las fechas son **provisionales** hasta
# la reunión inmediatamente anterior.
#
# ⚠️ **2026 NO está declarado en `meetings`, y no es un olvido.** Su sección no se pudo recuperar
# de la fuente. El **2026-10-04** se intentó por tres vías y las tres fallaron sin ambigüedad:
#
#   1. la página completa (167 KB): el lector trunca el centro y la sección de 2026 cae en el hueco;
#   2. la misma página con un lector de texto (64 KB): trunca a 50 KB y 2026 cae en el mismo hueco;
#   3. rutas por año (`fomchistorical2025.htm`, `fomchistorical2026.htm`) y el índice de notas de
#      prensa por año: **404**.
#
# **No se inventa ninguna fecha.** El hueco se declara como **dato** en `pending` —con su motivo y
# la fecha del intento—, no como un comentario: así el aviso del camino diario lo **nombra** y viaja
# al `manifest`, en vez de dejar un genérico que se lee como «hoy no hay FOMC».
#
# **Procedimiento para reintentarlo** (tarea #132): (1) leer la fuente con un lector que no trunque
# por el centro, o pedirla por tramos; (2) o que el propietario aporte las fechas desde la fuente
# —precedente: la tabla de costes del bróker, `plan.md` §3.3— y se declaren con su procedencia.
#
# Y la regla que sostiene todo esto: un año **ausente** produce un aviso visible, nunca un conjunto
# vacío silencioso: «hoy no hay FOMC» y «nadie ha declarado el calendario» son cosas distintas y el
# camino diario tiene que poder distinguirlas.

version: 1
source: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
verified_on: 2026-10-03
tentative_note: >-
  Each meeting date is tentative until confirmed at the meeting immediately preceding it.

# Años que se intentaron recuperar y **no** se pudieron declarar. No son «años sin reuniones»: son
# años cuyo calendario **nadie ha declarado**.
pending:
  2026:
    reason: >-
      la extracción de la fuente se corta antes de la sección de 2026: probados dos lectores (página
      completa y lector de texto) y tres rutas alternativas, todas sin la sección o con 404
    attempted_on: 2026-10-04

# Días de reunión por año: cada año lleva **las ocho reuniones** con sus dos días, tal como la Fed
# las publica. Decidir si bloquea sólo el día del comunicado (el segundo, 14:00 ET) o también el
# primero es una decisión de estrategia (`plan.md` §19), no de este artefacto: aquí se declara lo
# que la fuente dice.
meetings:
  2027:
    - 2027-01-26
    - 2027-01-27
    - 2027-03-16
    - 2027-03-17
    - 2027-04-27
    - 2027-04-28
    - 2027-06-08
    - 2027-06-09
    - 2027-07-27
    - 2027-07-28
    - 2027-09-14
    - 2027-09-15
    - 2027-10-26
    - 2027-10-27
    - 2027-12-07
    - 2027-12-08
