# Hooks locales de calidad (tech_stack.md §4.1 y §4.14).
# Desde #85 el CI (.github/workflows/ci.yml) es la barrera completa sobre un clon
# limpio; estos hooks siguen siendo la barrera rápida local.
#
#   uv run pre-commit install
#
default_language_version:
  python: python3.12

repos:
  # ── ruff desde el entorno del proyecto ─────────────────────────────────────
  # Se invoca con `uv run` a propósito: así el linter que usan los hooks es
  # exactamente el que fija `uv.lock`, sin deriva de versiones.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # ── puerta del golden de la matriz (#17, A15) ──────────────────────────
      # Etapa `pre-push`: la puerta del *golden dataset* de la matriz de las cinco familias
      # (tests/test_integrity.py). `always_run: true` + `pass_filenames: false` son
      # imprescindibles: sin ellas el hook no recibe ficheros, no se ejecuta y quedaria en un
      # no-op silencioso. Se queda en `pre-push` y sigue siendo **solo** el golden: la suite
      # completa corre en el CI (#85), no aquí. La alternativa de tech_stack.md §4.14 (la
      # suite entera en `pre-push`) se descartó por lenta.
      - id: integrity-golden
        name: integrity golden (T17)
        entry: 'uv run pytest tests/test_integrity.py -q -k "golden_matrix or version_gate"'
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        require_serial: true

  # ── higiene general ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  # ── detección de secretos ──────────────────────────────────────────────────
  # La clave del LLM tiene valor económico: no puede acabar en un commit.
  # `.env.example` se excluye por diseño: es una plantilla con claves vacías.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^\.env\.example$
